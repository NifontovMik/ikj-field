<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d63">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>IKJ Field</title>
<style>
:root{
  --ink:#14181d; --muted:#5b6672; --bg:#eef1f4; --card:#fff; --line:#d3d9e0;
  --hdr:#0b3d63; --primary:#0b5cad; --primary-dark:#084a8c;
  --ok:#1b7a35; --ok-bg:#e3f3e7; --red:#c00000; --red-bg:#fdecec; --blue:#0066cc; --blue-bg:#e7f0fb;
  --warn:#8a5300; --warn-bg:#fff3dc;
  --mono:ui-monospace,"Roboto Mono","Droid Sans Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:6px;
  padding:8px 8px 8px 8px;padding-top:calc(8px + env(safe-area-inset-top));min-height:58px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
header.top .title{flex:1;min-width:0;padding:2px 4px;border-radius:10px}
header.top .title.tap{cursor:pointer}
header.top .title.tap:active{background:rgba(255,255,255,.14)}
header.top .title.tap .t1::after{content:" \25BE";font-size:14px;opacity:.85}
.t1{font-weight:700;font-size:18px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.t1.long{font-size:16px}.t1.xlong{font-size:14px}
.t2{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:0;color:#fff;min-width:46px;min-height:46px;border-radius:10px;font-size:24px;line-height:1;padding:0 8px}
.hbtn:active{background:rgba(255,255,255,.18)}
.hsend{background:#fff;color:var(--hdr);border:0;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700;font-size:15px;position:relative}
@media (max-width:360px){.hsend{padding:0 9px;font-size:14px}.hbtn{min-width:40px;padding:0 4px}.rr .code{font-size:16px;letter-spacing:0}.rr .num{flex-basis:24px}}
.badge{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;padding:0 5px;text-align:center}
.offl{font-size:12px;background:#ffd166;color:#3a2a00;border-radius:999px;padding:3px 8px;font-weight:700;white-space:nowrap}

main{padding:12px;padding-bottom:calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
button.card:active{background:#f3f6f9}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.mono,.code{font-family:var(--mono)}
.code{font-weight:700;font-size:18px;letter-spacing:.2px;word-break:break-all}
.red{color:var(--red)} .blue{color:var(--blue)} .okc{color:var(--ok)}
s{text-decoration-thickness:2px}
h3{font-size:15px;margin:16px 2px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

.btn{display:block;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;margin:0 0 10px;padding:8px 12px}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-outline{color:var(--red);border-color:var(--red)}
.btn.add{border-style:dashed;border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{min-height:58px;font-size:17px}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;padding:0 4px;font-size:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0}

.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#e9edf1;color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.prog{background:var(--warn-bg);color:var(--warn)}
.chip.blue{background:var(--blue-bg);color:var(--blue)} .chip.red{background:var(--red-bg);color:var(--red)}
.bar{height:6px;background:#e3e8ed;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok)}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap}
.cno{display:inline-block;font-family:var(--mono);font-weight:800;font-size:15px;background:var(--hdr);color:#fff;border-radius:7px;padding:1px 7px;margin-right:8px;white-space:nowrap;vertical-align:1px;max-width:100%;overflow-wrap:anywhere;white-space:normal}
.ft{margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jid{font-family:var(--mono);font-weight:700;font-size:16px;word-break:break-all}
.unsent{margin-top:6px;font-size:14px;font-weight:700;color:#b42318}
.warnbox{background:var(--warn-bg);border:1px solid #f0c36d;color:#5c3900;border-radius:12px;padding:12px;margin:0 0 10px;font-size:15px}
.errbox{background:var(--red-bg);border:1px solid #f1a9a9;color:#7a0b0b;border-radius:12px;padding:12px;margin:0 0 10px;font-size:15px;font-weight:600}
.info{background:#eef4fb;border:1px dashed var(--blue);color:#0b3a66;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:15px}
.sec-h{font-size:13px;font-weight:800;color:var(--hdr);margin:14px 0 8px;padding:6px 10px;background:#dfe7ef;border-radius:10px}
.jchip{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;background:#e9edf1;color:var(--muted);white-space:nowrap}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.navrow .btn{margin:0;min-height:48px;padding:4px 8px;line-height:1.2}
.navrow .btn .mono{font-weight:800}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#dfe5eb;border-radius:12px;padding:4px;margin:0 0 10px}
.tabs button{border:0;background:transparent;min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search,.inp{display:block;width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-size:17px;margin:0 0 10px}
.search:focus,.inp:focus{outline:2px solid var(--primary);border-color:var(--primary)}
textarea.inp{min-height:84px;resize:vertical}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:6px 2px 6px}

/* route */
ol.route{list-style:none;margin:0 0 10px;padding:0}
.rr{display:flex;align-items:stretch;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:6px}
.rr .num{flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:14px}
.rr .code-btn{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:6px 4px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px}
.rr .tick{flex:0 0 64px;border-radius:10px;border:2px solid var(--ok);background:#fff;color:var(--ok);font-size:28px;font-weight:800}
.rr .tick.on{background:var(--ok);color:#fff}
.rr.ok{background:var(--ok-bg);border-color:#b7dfc2}
.rr.chg{background:var(--blue-bg);border-color:#b8d3f3}
.rr.no{background:var(--red-bg);border-color:#f1b8b8}
.rr.add{background:var(--blue-bg);border-color:#b8d3f3;border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 2px 10px}

/* tray rows */
.trow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.trow .tb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.trow .tb button{min-height:50px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.trow .tb .y{border:2px solid var(--ok);color:var(--ok)} .trow .tb .y.on{background:var(--ok);color:#fff}
.trow .tb .n{border:2px solid var(--red);color:var(--red)} .trow .tb .n.on{background:var(--red);color:#fff}
.trow .tb .o{border:2px solid var(--blue);color:var(--blue)} .trow .tb .o.on{background:var(--blue);color:#fff}
.trow.ok{border-color:#b7dfc2} .trow.no{border-color:#f1b8b8} .trow.chg{border-color:#b8d3f3}
.trow .cbtn{background:none;border:0;padding:0;text-align:left;color:var(--ink)}
/* handed-over cable (Сдан): green tint, edit controls look inactive (taps explain why) */
.card.closed,.trow.closed{background:#eef8f0;border-color:#8fcb9d}
.chip.closed{background:var(--ok);color:#fff}
.trow.closed .tb button{opacity:.4}
.closedbar{margin:0 0 8px;padding:7px 10px;border-radius:9px;background:var(--ok);color:#fff;font-weight:700;font-size:15px}
.stcard{border-width:2px}
.stcard.closed{background:#eef8f0;border-color:var(--ok)}
.stval{font-size:19px;font-weight:800;margin:2px 2px 0}
.locked .rr .tick,.locked .lenbox .btn,.locked .tbtn{opacity:.4}
.locked .rr{opacity:.92}

/* photos */
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.sheet-bd{position:absolute;inset:0;background:rgba(10,20,30,.45)}
.sheet-pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.sh-title{margin:2px 2px 12px}
.sh-title .big{font-size:19px;font-weight:700}
.shelves{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 12px}
.sbtn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:18px;font-family:var(--mono)}
.sbtn.cur{background:#dfe5eb;color:var(--muted)}
.sbtn.wide{grid-column:span 2;font-size:14px;font-family:inherit}
.clist{max-height:42vh;overflow:auto;margin:0 0 10px}
.clist button{display:block;width:100%;text-align:left;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 6px;padding:8px 12px;font-family:var(--mono);font-weight:700;font-size:17px}
.clist button.pos{font-family:inherit;font-weight:600;font-size:16px}
.clist button.cur{border:2px solid var(--primary)}
.hint{font-size:14px;margin:-4px 2px 10px}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 2px 12px}
.chk input{width:24px;height:24px}

#toast{pointer-events:none;position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;background:#1d2733;color:#fff;
  border-radius:12px;padding:12px 14px;font-size:15px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 24px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{pointer-events:auto;background:transparent;border:0;color:#7cc4ff;font-weight:800;font-size:15px;padding:4px}
#busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:700}
#upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:#1d2733;color:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
#upd span{flex:1;font-size:15px}
#upd button{background:#fff;color:#1d2733;border:0;border-radius:10px;min-height:42px;padding:0 14px;font-weight:800}
.help p,.help li{font-size:16px}
.lenbox{margin-top:10px;padding:10px;border-radius:10px;background:#f4f6f8;border:1px solid var(--line);font-size:15px}
.lenbox.ok{background:var(--ok-bg);border-color:#b7dfc2}
.lenbox.diff{background:var(--blue-bg);border-color:#b8d3f3}
.lenbox .btn{margin:0;min-height:46px;font-size:15px;padding:4px 8px}
.notes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.nbtn{min-height:44px;border-radius:999px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:15px;padding:6px 14px}
.nbtn.on{background:var(--blue);color:#fff}
.nbtn.ghost{border-color:var(--line);color:var(--muted)}
.note{color:#0b4a8b;font-style:italic}
.ltabs button{min-height:56px;line-height:1.25;font-size:14px}
.ltabs .mono{font-size:13px;font-weight:700}
.langrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px;font-size:15px;color:var(--muted)}
.lbtn{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:4px 14px;font-weight:600;color:var(--muted)}
.lbtn.on{border-color:var(--primary);color:var(--primary);background:#eaf2fb}
.help li{margin:0 0 8px}
/* segments (cable printed in several parts with their own lengths) */
.segh{background:#fff;border:1px solid var(--line);border-left:5px solid var(--hdr);border-radius:12px;padding:10px 12px;margin:14px 0 8px}
.segh .segt{font-size:15px;line-height:1.35}
.segh .segn{display:inline-block;font-weight:800;color:#fff;background:var(--hdr);border-radius:7px;padding:0 7px;margin-right:4px;font-family:var(--mono)}
.segh .lenbox{margin-top:8px}
.tagrow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.tagrow .tl{font-size:14px;color:var(--muted);flex:1 0 100%}
.tbtn{flex:1 1 0;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;padding:4px 6px;color:var(--muted)}
.tbtn.y{border-color:var(--ok);color:var(--ok)} .tbtn.y.on{background:var(--ok);color:#fff}
.tbtn.n{border-color:var(--red);color:var(--red)} .tbtn.n.on{background:var(--red);color:#fff}
.tbtn.o{border-color:var(--blue);color:var(--blue)} .tbtn.o.on{background:var(--blue);color:#fff}
.rr .code.rng2{font-size:15px;color:var(--muted)} .rr .code.rng2.red{color:var(--red)}
.btn.add.seg{min-height:44px;font-size:15px;margin-top:-2px}
/* 1.7: ИКЖ в Excel, walk files, folders by building */
.btn.xls{background:#e7f4ea;border-color:#8fcb9d;color:#14532d;margin:10px 0 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 6px}
.grid3 .btn{margin:0;min-height:58px;font-size:14px;line-height:1.25;padding:6px 4px}
.fold .fhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold .fname{font-family:var(--mono);font-weight:800;font-size:20px}
.rescard .rname{font-family:var(--mono);font-weight:700;font-size:14px;word-break:break-all}
.dhint{text-align:center;margin:-2px 4px 12px}
body.drop main{outline:3px dashed var(--primary);outline-offset:-6px;border-radius:14px}
/* 1.7.1: add a tray before / after the selected one */
.grid2.addba{margin:0 0 10px}
.grid2.addba .btn{min-height:56px;font-size:15px;line-height:1.25;padding:6px 8px}
</style>
</head>
<body>
<header class="top">
  <button class="hbtn hidden" id="hBack" aria-label="Back">&#8592;</button>
  <div class="title" id="hTitle"><div class="t1" id="hT1">IKJ Field</div><div class="t2" id="hT2"></div></div>
  <span class="offl hidden" id="hOff">Offline</span>
  <div id="hAct"></div>
</header>
<main id="view"></main>
<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden">Working…</div>
<div id="upd" class="hidden"><span>A new version of the app is ready.</span><button id="updBtn">Update</button></div>
<input type="file" id="fileJournal" class="hidden" multiple>
<input type="file" id="fileBackup" class="hidden">
<input type="file" id="filePhoto" accept="image/*" class="hidden">
<script>
'use strict';
const APP_VERSION = '1.7.2';
const EMBEDDED_JOURNAL = null; /*EMBED*/
const ST = {U:'unchecked', OK:'ok', CHG:'changed', NO:'absent', ADD:'added'};
/* tray code: building (12.12URF10.109/3), site trestle (00USY24.195.02/3) or 07UBG structure (07UBG080P024.01/46);
   a Latin letter marks a penetration: instead of the shelf (…/A) or at the end (…/3A, …243A) */
const CODE_RE = /^(?:\d{2}\.\d{2}[A-Z]{3}\d{2}\.\d{3}(?:\.\d)?(?:V(?:_\d{3})?|\(V\))?|\d{2}[A-Z]{3}\d{2}\.\d{3}\.\d{2}|\d{2}[A-Z]{3}\d{2}EM\d{4}|\d{2}[A-Z]{3}\d{3}[A-Z]\d{3}\.\d{2})(?:\/(?:\d{1,2}[A-Z]?|[A-Z])|[A-Z])?$/;
/* a range of site-trestle trays «00USY24.176.01/10 - 00USY24.176.05/10»: the cable runs along all sections 01…05.
   One item of the route; can be split into single trays in the app */
const isRange = x => / - /.test(String(x || ''));
const rangeCodes = x => String(x).split(' - ').map(t => t.trim());
function expandRange(x) {
  const [a, b] = rangeCodes(x), ta = a.match(/\d+|\D+/g) || [], tb = b.match(/\d+|\D+/g) || [];
  if (ta.length !== tb.length) return [a, b];
  const diff = ta.map((t, i) => (t !== tb[i] ? i : -1)).filter(i => i >= 0);
  if (diff.length !== 1 || !/^\d+$/.test(ta[diff[0]]) || !/^\d+$/.test(tb[diff[0]]) || ta[diff[0]].length !== tb[diff[0]].length) return [a, b];
  const i = diff[0], lo = +ta[i], hi = +tb[i], step = hi >= lo ? 1 : -1;
  if (Math.abs(hi - lo) > 60) return [a, b];
  const out = [];
  for (let v = lo; step > 0 ? v <= hi : v >= hi; v += step) { const t = ta.slice(); t[i] = String(v).padStart(ta[i].length, '0'); out.push(t.join('')); }
  return out;
}
const codesOf = x => (isRange(x) ? expandRange(x) : [x]);
function rangeShort(x) { const [a, b] = rangeCodes(x); let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; i = Math.max(0, a.lastIndexOf('.', i) + 1); return a + ' – ' + b.slice(i); }
const rangeWithShelf = (x, shelf) => rangeCodes(x).map(c => withShelf(splitCode(c).section, shelf)).join(' - ');
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const NOTE_KEYS = {box: 'in a box', hose: 'in metal hose', pipe: 'in a pipe'};

const $ = (s, el) => (el || document).querySelector(s);
const view = $('#view'), sheet = $('#sheet');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent, dec = decodeURIComponent;
const nowIso = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const natCmp = (a, b) => String(a).localeCompare(String(b), 'en', {numeric: true, sensitivity: 'base'});
const normCode = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/,/g, '.');
const squash = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
function matchCodes(known, raw) {
  const q = normCode(raw); if (!q) return known;
  let list = known.filter(c => c.includes(q));
  if (!list.length) { const qs = squash(raw); if (qs) list = known.filter(c => squash(c).includes(qs)); }
  return list;
}
const shortId = id => String(id || '');   /* journals are shown by their full code: TB0002 exists in several buildings */
function splitCode(code) { const c = String(code || ''); const i = c.lastIndexOf('/'); return i < 0 ? {section: c, shelf: null} : {section: c.slice(0, i), shelf: c.slice(i + 1)}; }
const withShelf = (section, shelf) => (shelf === null || shelf === '' ? section : section + '/' + shelf);

const Store = (() => {
  let db = null, mode = 'idb';
  const mem = new Map(), memPh = new Map();
  function open() {
    return new Promise(resolve => {
      if (!('indexedDB' in window)) { mode = 'memory'; return resolve(); }
      let done = false;
      const fin = m => { if (done) return; done = true; if (m) mode = m; resolve(); };
      const timer = setTimeout(() => fin('memory'), 5000);
      try {
        const req = indexedDB.open('ikj-field', 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath: 'id'});
        };
        req.onsuccess = () => { clearTimeout(timer); db = req.result; fin(); };
        req.onerror = () => { clearTimeout(timer); fin('memory'); };
      } catch (e) { clearTimeout(timer); fin('memory'); }
    });
  }
  function tx(store, rw, fn) {
    return new Promise((resolve, reject) => {
      let out;
      try {
        const t = db.transaction(store, rw), s = t.objectStore(store), r = fn(s);
        if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => resolve(out);
        t.onerror = () => reject(t.error); t.onabort = () => reject(t.error || new Error('aborted'));
      } catch (e) { reject(e); }
    });
  }
  return {
    open, get mode() { return mode; },
    get: k => mode === 'memory' ? Promise.resolve(mem.get(k)) : tx('kv', 'readonly', s => s.get(k)),
    set: (k, v) => mode === 'memory' ? (mem.set(k, JSON.parse(JSON.stringify(v))), Promise.resolve()) : tx('kv', 'readwrite', s => s.put(v, k)),
    del: k => mode === 'memory' ? (mem.delete(k), Promise.resolve()) : tx('kv', 'readwrite', s => s.delete(k)),
    keys: () => mode === 'memory' ? Promise.resolve([...mem.keys()]) : tx('kv', 'readonly', s => s.getAllKeys()),
    putPhoto: p => mode === 'memory' ? (memPh.set(p.id, p), Promise.resolve()) : tx('photos', 'readwrite', s => s.put(p)),
    getPhoto: id => mode === 'memory' ? Promise.resolve(memPh.get(id)) : tx('photos', 'readonly', s => s.get(id)),
    delPhoto: id => mode === 'memory' ? (memPh.delete(id), Promise.resolve()) : tx('photos', 'readwrite', s => s.delete(id)),
    allPhotos: () => mode === 'memory' ? Promise.resolve([...memPh.values()]) : tx('photos', 'readonly', s => s.getAll()),

})();

  const CODE_P = String.raw`(?:\d{2}\.\d{2}[A-Z]{3}\d{2}\.\d{3}(?:\.\d)?(?:V(?:_\d{3})?|\(V\))?|\d{2}[A-Z]{3}\d{2}\.\d{3}\.\d{2}|\d{2}[A-Z]{3}\d{2}EM\d{4}|\d{2}[A-Z]{3}\d{3}[A-Z]\d{3}\.\d{2})(?:\/(?:\d{1,2}[A-Z]?|[A-Z])|[A-Z])?(?![A-Za-z0-9])`;

  }

  /* ---------------------------------------------------------------- marks of the phone -> rich text (ikj_tool) */
  const F_BLACK = {n: 'Arial', s: 9, c: BLACK}, F_RED = {n: 'Arial', s: 9, c: RED, st: 1}, F_BLUE = {n: 'Arial', s: 9, c: BLUE};

      if (!isNone(e.seg) && e.status === ST_NO) t += ' вдоль полки';
      return t;
    }
    return txt;
  }
  function designItems(entries) {
    const out = []; let lastRg = null;
    for (const e of entries) {
      if (isNone(e.seg)) continue;
      const rg = e.rg;
      if (rg) { if (rg !== lastRg) out.push(rg); lastRg = rg; }
      else { out.push(e.seg); lastRg = null; }

    return out;
  }
  function assignSg(entries, tplSegs) {
    const design = entries.filter(e => !isNone(e.seg)), nSeg = (tplSegs || []).length;
    if (!design.length || design.every(e => !isNone(e.sg))) {
      let last = design.length ? (isNone(design[0].sg) ? 0 : design[0].sg) : 0;
      for (const e of entries) { if (isNone(e.sg)) e.sg = last; else last = e.sg; }
      return;
    }
    const counts = tplSegs.map(sg => sg.items.length);

      if (isNone(e.seg)) { e.sg = Math.min(si, nSeg - 1); continue; }

  }
  function itemBlocks(entries) {

    }

  }
  function segLenBlocks(tplLen, rs) {
    const d = isNone(tplLen) ? '?' : fmtLen(tplLen), fl = (rs || {}).factLength;
    if (isNone(fl) || fl === '' || isNone(tplLen)) return [[[`${d} м`, F_BLACK]], `${d} м`];
    try {
      if (pyFloat(fl) === pyFloat(tplLen)) return [[[`${d} м`, F_BLACK]], `${d} м`];

      let head = `${sg.n}) ${lt}`;
      if (sg.text) { parts.push([` — ${sg.text}`, F_BLACK]); head += ` — ${sg.text}`; }

  }
  function segLensRu(rcSegs) {
    const out = [];

  /* cables by status (ikj_tool.split_marks): 1.6+ — field closed; older files — note «Сдан» */

  /* ---------------------------------------------------------------- the workbook (ikj_tool.apply_results) */
  const C_AL = {h: 'center', v: 'center', w: 1}, L_AL = {h: 'left', v: 'center', w: 1};
  const THIN = ['thin', BLACK], BORDER = {l: THIN, r: THIN, t: THIN, b: THIN};
  function build(J, res0, group, fileName) {
    const F = J && J.form;
    if (!F || !(F.v >= 1)) throw new Error('no-form');
    const res = JSON.parse(JSON.stringify(res0));
    if (res.format !== 'ikj-field-results') throw new Error('Это не файл результатов обхода IKJ Field.');
    const jinfo = res.journal || {};
    const rows = J.cables.map((c, i) => {
      const cells = new Map(); for (const [col, v, s] of c.xr[1]) cells.set(col, {v, s});
      const lv = cells.get(12), pr = parseRoute(lv && typeof lv.v === 'string' ? lv.v : null);

      return {key: c.mark, trow: isNone(c.row) ? F.first + i : c.row, h: c.xr[0], cells, doc: pyStrip(String(av && !isNone(av.v) ? av.v : '')),
              len: jv ? (isNone(jv.v) ? null : jv.v) : null, route: pr.codes, lPrefix: pr.prefix, lSuffix: pr.suffix, segs: pr.segs};
    }).sort((a, b) => a.trow - b.trow);
    rows.forEach((x, i) => { if (x.trow !== F.first + i) throw new Error('form-rows'); });
    const tplId = rows.length ? rows[0].doc : '';
    if (jinfo.id && jinfo.id !== tplId) throw new Error(`Файл обхода относится к журналу ${jinfo.id}, а шаблон — к ${tplId}.`);
    const notes = [];
    if (jinfo.hash && jinfo.hash !== J.hash) notes.push('Версия журнала в телефоне отличается от шаблона (после выдачи журнала менялась РД). Расхождения по кабелям — в графе «Замечания конвертера».');
    const byMark = new Map(); for (const c of res.cables || []) byMark.set(normMark(c.mark), c);
    const used = new Set();
    const styles = F.styles;
    const colW = c => { const d = (F.cols || []).find(x => x[0] <= c && c <= x[1]); return d && d[2] ? d[2] : 13; };
    const widthL = colW(12) || 9.0;

      const r = F.first + i;

      if (!rc) { item.status = 'нет в файле обхода'; report.push(item); return; }

    const F9 = {n: 'Arial', s: 9}, F9B = {n: 'Arial', s: 9, b: 1}, F12B = {n: 'Arial', s: 12, b: 1};
    const HF = {t: 'solid', fg: 'FFD9D9D9'};
    const FILL = {'проверен': 'FFE2EFDA', 'проверен, «готов» не нажат': 'FFE2EFDA', 'в работе': 'FFFFF2CC', 'не начат': 'FFF8CBAD',

    const cols = [['№', 5, C_AL, (n, it) => n], ['Строка ИКЖ', 7, C_AL, (n, it) => it.row],
      ['Монтажная марка', 20, L_AL, (n, it) => it.mark], ['Статус', 17, L_AL, (n, it) => it.status],

    const ob = {name: 'Обход', rows: new Map(), cols: cols.map((c, i) => [i + 1, i + 1, c[1], 1, 0]), fmt: {dh: 15, bw: 8},

    if (p[2] === 't' && p.length >= 4) return {v: 'tray', jid: p[1], code: p.slice(3).join('/')};
    return {v: 'journal', jid: p[1]};

  if (p[0] === 't' && p.length >= 2) return {v: 'tray', jid: null, code: p.slice(1).join('/')};
  if (p[0] === 'settings') return {v: 'settings'};

const photoURLs = [];

  <p><b>ИКЖ в Excel.</b> В журнале нажмите <b>📊 ИКЖ в Excel</b> → <b>Сданные</b>, <b>В работе</b> или <b>Все</b>. Телефон сам сделает исполнительный кабельный журнал в Excel — та же форма, что в офисе: трасса по факту чёрным / красным / синим, длины по факту, ИТОГО; на втором листе «Обход» — что осталось сделать по каждому кабелю. Файл сохраняется в «Загрузки»: откройте его в Excel, WPS или Google Таблицах или отправьте оттуда. Работает без интернета. Приложение пишет, что файл журнала старый? Попросите у руководителя новый файл журнала и загрузите его — отметки сохранятся.</p>
  <p><b>4. Проверка у полки.</b> Стоите у одной полки? Откройте <b>По полкам</b> (или наберите код полки на главном экране) — видны кабели <b>всех</b> загруженных журналов на этой полке, их можно отметить разом.</p>
  <p><b>5. Цвета</b> как в журнале: чёрный — по проекту, <span class="red"><s>красный зачёркнутый</s></span> — проектная полка не использована, <span class="blue">синий</span> — фактическая полка.</p>
  <p><b>6. Ошибка?</b> Нажмите <b>Отменить</b> в сообщении внизу или код полки → <b>Снять отметку</b>.</p>
  <p><b>7. Отправка.</b> Нажмите <b>Отправить</b> (вверху справа) → Telegram → руководителю. Каждый журнал — отдельный файл. Нет связи — Telegram отправит, когда связь появится. В каждом файле <b>вся</b> работа на момент отправки — отправляйте самый свежий.</p>
  <p><b>Папки.</b> Когда журналов много, на главном экране они собраны в папки по зданиям (11URB, 11URF…). Нажмите на папку — откроются её журналы. Поиск на главном экране ищет по всем журналам.</p>
  <p><b>На компьютере (Windows).</b> Откройте сайт в Edge или Chrome → <b>Установить IKJ Field</b> (значок в адресной строке или меню ⋯ → Приложения). Загрузите журналы, затем откройте — или перетащите в окно — файлы обхода IKJ_….txt, которые прислали электрики: у каждого файла <b>Сданные / В работе / Все</b> → Excel.</p>
  <p><b>Важно:</b> приложение работает без интернета. Отметки хранятся только в этом телефоне, пока вы их не отправите — не удаляйте приложение и не очищайте данные Chrome. Отправляйте хотя бы раз в день.</p>
  <p class="small muted">Язык: ⚙ → Язык / Language.</p>
  </div>`;

  const shelfOf = rng ? splitCode(rangeCodes(cur)[0]).shelf : sp.shelf;
  h += `<div class="lbl">${isAdd ? T('Same tray, other shelf:') : T('Same tray, cable is on shelf:')} <span class="mono">${rng ? esc(rangeShort(cur).replace(/\/[^/ –]*/g, '')) + '/…' : esc(sp.section) + '/…'}</span></div>
    <div class="shelves">${shelvesList().map(s => `<button class="sbtn ${s === shelfOf ? 'cur' : ''}" data-sact="shelf" data-s="${s}">${s}</button>`).join('')}<button class="sbtn wide ${shelfOf === null ? 'cur' : ''}" data-sact="shelf" data-s="">${T('no shelf')}</button></div>
    ${rng ? '' : `<button class="btn" data-sact="letters">${T('Penetration letter A–Z…')}</button>`}
    <button class="btn" data-sact="other">${isAdd ? T('Change to another tray…') : T('Cable is on another tray…')}</button>
    <div class="grid2 addba"><button class="btn add" data-sact="before">${T('＋ Add a tray before this one…')}</button><button class="btn add" data-sact="after">${T('＋ Add a tray after this one…')}</button></div>
    <div class="lbl">${T('Note for this tray')}</div><div class="notes">${noteChips(e)}</div>`;
  if (isAdd) h += `<button class="btn danger-outline" data-sact="del">${T('Delete this added tray')}</button>`;
  else if (e.st !== ST.U) h += `<button class="btn" data-sact="clear">${T('↺ Clear mark (not checked)')}</button>`;
  h += `<button class="btn ghost" data-sact="close">${T('Cancel')}</button>`;
  const apply = code => { if (isAdd) setAdded(jid, mark, k, code); else setDesign(jid, mark, k, ST.CHG, code); };
  openSheet(h, async (act, ds) => {
    if (await noteAct(jid, mark, k, act, ds)) return;

    else if (act === 'letters') { openLetterSheet(cur, code => { if (code !== cur) apply(code); closeSheet(); render(); }, esc(mark)); return; }
    else if (act === 'clear') setDesign(jid, mark, k, ST.U);
    else if (act === 'shelf') { const sh = ds.s === '' ? null : ds.s, code = rng ? rangeWithShelf(cur, sh) : withShelf(sp.section, sh); if (code === cur) { closeSheet(); return; } apply(code); }

    else if (act === 'other') { const code = await pickCode({title: isAdd ? T('Change tray') : T('Where is the cable actually?'), base: cur, sub: `${esc(mark)}${T(' · instead of ')}<span class="mono">${esc(cur)}</span>`}); if (!code) return; apply(code); render(); return; }
    else if (act === 'after') { const code = await pickCode({title: T('Add a tray after {c}', {c: rng ? rangeShort(cur) : cur}), sub: esc(mark)}); if (!code) return; insertAt(jid, mark, k, code); render(); return; }
    else if (act === 'before') { const code = await pickCode({title: T('Add a tray before {c}', {c: rng ? rangeShort(cur) : cur}), sub: esc(mark)}); if (!code) return; insertBefore(jid, mark, k, code); render(); return; }
    else if (act === 'del') deleteAdded(jid, mark, k);
    else return;
    closeSheet(); render();
  });
}

    }

  if (isClosed(jid, mark)) { lockedToast(); return; }

  const pos = await new Promise(resolve => {

let photoTarget = null;
async function downscale(file, max = 1600, q = 0.72) {
  let src;
  try { src = await createImageBitmap(file); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, sc = Math.min(1, max / Math.max(w0, h0));
  const cv = document.createElement('canvas'); cv.width = Math.round(w0 * sc); cv.height = Math.round(h0 * sc);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', q));
}

    const show = w => { $('#upd').classList.remove('hidden'); $('#updBtn').onclick = () => { window.__ikjUpdating = true; w.postMessage('skipWaiting'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); }); });
  }).catch(e => console.warn('SW', e));
}

/* ---------------------------------------------------------------- boot */
(async function boot() {
  await Store.open();
  try {
    for (const k of await Store.keys()) {
      const v = await Store.get(k);
      if (k === 'settings' && v) S.settings = Object.assign(S.settings, v);
      else if (k.startsWith('journal:') && v && v.id) S.journals[v.id] = v;
      else if (k.startsWith('result:') && v && v.journalId) S.results[v.journalId] = v;
    }
  } catch (e) { console.error(e); }
  if (!S.settings.lang) S.settings.lang = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'en';
  LANG = S.settings.lang === 'ru' ? 'ru' : 'en'; applyLang();
  for (const id in S.journals) {
    buildIdx(id);
    if (!S.results[id]) S.results[id] = newResult(S.journals[id]);
    for (const c of S.journals[id].cables) { if (!S.results[id].cables[c.mark]) S.results[id].cables[c.mark] = newCableResult(c); else ensureSegs(c, S.results[id].cables[c.mark]); }
  }
  for (const ej of [].concat(EMBEDDED_JOURNAL || [])) if (!S.journals[ej.id]) { try { await addJournal(ej, {silent: true}); } catch (e) { console.error(e); } }
  try { if (navigator.storage && navigator.storage.persist) { S.persisted = await navigator.storage.persisted(); if (!S.persisted) S.persisted = await navigator.storage.persist(); } } catch (e) {}
  registerSW();
  render();
})();
</script>
