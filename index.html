<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d63">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>IKJ Field</title>
<style>
:root{
  --ink:#14181d; --muted:#5b6672; --bg:#eef1f4; --card:#fff; --line:#d3d9e0;
  --hdr:#0b3d63; --primary:#0b5cad; --primary-dark:#084a8c;
  --ok:#1b7a35; --ok-bg:#e3f3e7; --red:#c00000; --red-bg:#fdecec; --blue:#0066cc; --blue-bg:#e7f0fb;
  --warn:#8a5300; --warn-bg:#fff3dc;
  --mono:ui-monospace,"Roboto Mono","Droid Sans Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:6px;
  padding:8px 8px 8px 8px;padding-top:calc(8px + env(safe-area-inset-top));min-height:58px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
header.top .title{flex:1;min-width:0;padding:2px 4px;border-radius:10px}
header.top .title.tap{cursor:pointer}
header.top .title.tap:active{background:rgba(255,255,255,.14)}
header.top .title.tap .t1::after{content:" \25BE";font-size:14px;opacity:.85}
.t1{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:0;color:#fff;min-width:46px;min-height:46px;border-radius:10px;font-size:24px;line-height:1;padding:0 8px}
.hbtn:active{background:rgba(255,255,255,.18)}
.hsend{background:#fff;color:var(--hdr);border:0;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700;font-size:15px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;padding:0 5px;text-align:center}
.offl{font-size:12px;background:#ffd166;color:#3a2a00;border-radius:999px;padding:3px 8px;font-weight:700;white-space:nowrap}

main{padding:12px;padding-bottom:calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
button.card:active{background:#f3f6f9}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.mono,.code{font-family:var(--mono)}
.code{font-weight:700;font-size:18px;letter-spacing:.2px;word-break:break-all}
.red{color:var(--red)} .blue{color:var(--blue)} .okc{color:var(--ok)}
s{text-decoration-thickness:2px}
h3{font-size:15px;margin:16px 2px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

.btn{display:block;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;margin:0 0 10px;padding:8px 12px}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-outline{color:var(--red);border-color:var(--red)}
.btn.add{border-style:dashed;border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{min-height:58px;font-size:17px}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;padding:0 4px;font-size:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{margin:0}

.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#e9edf1;color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.prog{background:var(--warn-bg);color:var(--warn)}
.chip.blue{background:var(--blue-bg);color:var(--blue)} .chip.red{background:var(--red-bg);color:var(--red)}
.bar{height:6px;background:#e3e8ed;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok)}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap}
.cno{display:inline-block;font-family:var(--mono);font-weight:800;font-size:15px;background:var(--hdr);color:#fff;border-radius:7px;padding:1px 7px;margin-right:8px;white-space:nowrap;vertical-align:1px}
.ft{margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jid{font-family:var(--mono);font-weight:700;font-size:16px;word-break:break-all}
.unsent{margin-top:6px;font-size:14px;font-weight:700;color:#b42318}
.warnbox{background:var(--warn-bg);border:1px solid #f0c36d;color:#5c3900;border-radius:12px;padding:12px;margin:0 0 10px;font-size:15px}
.errbox{background:var(--red-bg);border:1px solid #f1a9a9;color:#7a0b0b;border-radius:12px;padding:12px;margin:0 0 10px;font-size:15px;font-weight:600}
.info{background:#eef4fb;border:1px dashed var(--blue);color:#0b3a66;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:15px}
.sec-h{font-size:13px;font-weight:800;color:var(--hdr);margin:14px 0 8px;padding:6px 10px;background:#dfe7ef;border-radius:10px}
.jchip{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;background:#e9edf1;color:var(--muted);white-space:nowrap}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.navrow .btn{margin:0;min-height:48px;padding:4px 8px;line-height:1.2}
.navrow .btn .mono{font-weight:800}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#dfe5eb;border-radius:12px;padding:4px;margin:0 0 10px}
.tabs button{border:0;background:transparent;min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search,.inp{display:block;width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-size:17px;margin:0 0 10px}
.search:focus,.inp:focus{outline:2px solid var(--primary);border-color:var(--primary)}
textarea.inp{min-height:84px;resize:vertical}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:6px 2px 6px}

/* route */
ol.route{list-style:none;margin:0 0 10px;padding:0}
.rr{display:flex;align-items:stretch;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:6px}
.rr .num{flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:14px}
.rr .code-btn{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:6px 4px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px}
.rr .tick{flex:0 0 64px;border-radius:10px;border:2px solid var(--ok);background:#fff;color:var(--ok);font-size:28px;font-weight:800}
.rr .tick.on{background:var(--ok);color:#fff}
.rr.ok{background:var(--ok-bg);border-color:#b7dfc2}
.rr.chg{background:var(--blue-bg);border-color:#b8d3f3}
.rr.no{background:var(--red-bg);border-color:#f1b8b8}
.rr.add{background:var(--blue-bg);border-color:#b8d3f3;border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 2px 10px}

/* tray rows */
.trow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.trow .tb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.trow .tb button{min-height:50px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.trow .tb .y{border:2px solid var(--ok);color:var(--ok)} .trow .tb .y.on{background:var(--ok);color:#fff}
.trow .tb .n{border:2px solid var(--red);color:var(--red)} .trow .tb .n.on{background:var(--red);color:#fff}
.trow .tb .o{border:2px solid var(--blue);color:var(--blue)} .trow .tb .o.on{background:var(--blue);color:#fff}
.trow.ok{border-color:#b7dfc2} .trow.no{border-color:#f1b8b8} .trow.chg{border-color:#b8d3f3}
.trow .cbtn{background:none;border:0;padding:0;text-align:left;color:var(--ink)}

/* photos */
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.sheet-bd{position:absolute;inset:0;background:rgba(10,20,30,.45)}
.sheet-pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.sh-title{margin:2px 2px 12px}
.sh-title .big{font-size:19px;font-weight:700}
.shelves{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 12px}
.sbtn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:18px;font-family:var(--mono)}
.sbtn.cur{background:#dfe5eb;color:var(--muted)}
.sbtn.wide{grid-column:span 2;font-size:14px;font-family:inherit}
.clist{max-height:42vh;overflow:auto;margin:0 0 10px}
.clist button{display:block;width:100%;text-align:left;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 0 6px;padding:8px 12px;font-family:var(--mono);font-weight:700;font-size:17px}
.clist button.pos{font-family:inherit;font-weight:600;font-size:16px}
.clist button.cur{border:2px solid var(--primary)}
.hint{font-size:14px;margin:-4px 2px 10px}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 2px 12px}
.chk input{width:24px;height:24px}

#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;background:#1d2733;color:#fff;
  border-radius:12px;padding:12px 14px;font-size:15px;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{pointer-events:auto;background:transparent;border:0;color:#7cc4ff;font-weight:800;font-size:15px;padding:4px}
#busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:700}
#upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:#1d2733;color:#fff;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
#upd span{flex:1;font-size:15px}
#upd button{background:#fff;color:#1d2733;border:0;border-radius:10px;min-height:42px;padding:0 14px;font-weight:800}
.help p,.help li{font-size:16px}
.help li{margin:0 0 8px}
</style>
</head>
<body>
<header class="top">
  <button class="hbtn hidden" id="hBack" aria-label="Back">&#8592;</button>
  <div class="title" id="hTitle"><div class="t1" id="hT1">IKJ Field</div><div class="t2" id="hT2"></div></div>
  <span class="offl hidden" id="hOff">Offline</span>
  <div id="hAct"></div>
</header>
<main id="view"></main>
<div id="sheet" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden">Working…</div>
<div id="upd" class="hidden"><span>A new version of the app is ready.</span><button id="updBtn">Update</button></div>
<input type="file" id="fileJournal" class="hidden" multiple>
<input type="file" id="fileBackup" class="hidden">
<input type="file" id="filePhoto" accept="image/*" class="hidden">
<script>
'use strict';
const APP_VERSION = '1.1.0';
const EMBEDDED_JOURNAL = null; /*EMBED*/
const ST = {U:'unchecked', OK:'ok', CHG:'changed', NO:'absent', ADD:'added'};
const CODE_RE = /^\d{2}\.\d{2}[A-Z]{3}\d{2}\.\d{3}V?(\/\d{1,2})?$/;

const $ = (s, el) => (el || document).querySelector(s);
const view = $('#view'), sheet = $('#sheet');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent, dec = decodeURIComponent;
const nowIso = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const natCmp = (a, b) => String(a).localeCompare(String(b), 'en', {numeric: true, sensitivity: 'base'});
const normCode = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/,/g, '.');
const squash = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
function matchCodes(known, raw) {
  const q = normCode(raw); if (!q) return known;
  let list = known.filter(c => c.includes(q));
  if (!list.length) { const qs = squash(raw); if (qs) list = known.filter(c => squash(c).includes(qs)); }
  return list;
}
const shortId = id => { const p = String(id || '').split('.'); return p[p.length - 1] || id; };
function splitCode(code) { const c = String(code || ''); const i = c.lastIndexOf('/'); return i < 0 ? {section: c, shelf: null} : {section: c.slice(0, i), shelf: c.slice(i + 1)}; }
const withShelf = (section, shelf) => (shelf === null || shelf === '' ? section : section + '/' + shelf);
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso); const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return `${String(d.getDate()).padStart(2, '0')} ${m} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------------------------------------------------------------- storage */
const Store = (() => {
  let db = null, mode = 'idb';
  const mem = new Map(), memPh = new Map();
  function open() {
    return new Promise(resolve => {
      if (!('indexedDB' in window)) { mode = 'memory'; return resolve(); }
      let done = false;
      const fin = m => { if (done) return; done = true; if (m) mode = m; resolve(); };
      const timer = setTimeout(() => fin('memory'), 5000);
      try {
        const req = indexedDB.open('ikj-field', 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath: 'id'});
        };
        req.onsuccess = () => { clearTimeout(timer); db = req.result; fin(); };
        req.onerror = () => { clearTimeout(timer); fin('memory'); };
      } catch (e) { clearTimeout(timer); fin('memory'); }
    });
  }
  function tx(store, rw, fn) {
    return new Promise((resolve, reject) => {
      let out;
      try {
        const t = db.transaction(store, rw), s = t.objectStore(store), r = fn(s);
        if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => resolve(out);
        t.onerror = () => reject(t.error); t.onabort = () => reject(t.error || new Error('aborted'));
      } catch (e) { reject(e); }
    });
  }
  return {
    open, get mode() { return mode; },
    get: k => mode === 'memory' ? Promise.resolve(mem.get(k)) : tx('kv', 'readonly', s => s.get(k)),
    set: (k, v) => mode === 'memory' ? (mem.set(k, JSON.parse(JSON.stringify(v))), Promise.resolve()) : tx('kv', 'readwrite', s => s.put(v, k)),
    del: k => mode === 'memory' ? (mem.delete(k), Promise.resolve()) : tx('kv', 'readwrite', s => s.delete(k)),
    keys: () => mode === 'memory' ? Promise.resolve([...mem.keys()]) : tx('kv', 'readonly', s => s.getAllKeys()),
    putPhoto: p => mode === 'memory' ? (memPh.set(p.id, p), Promise.resolve()) : tx('photos', 'readwrite', s => s.put(p)),
    getPhoto: id => mode === 'memory' ? Promise.resolve(memPh.get(id)) : tx('photos', 'readonly', s => s.get(id)),
    delPhoto: id => mode === 'memory' ? (memPh.delete(id), Promise.resolve()) : tx('photos', 'readwrite', s => s.delete(id)),
    allPhotos: () => mode === 'memory' ? Promise.resolve([...memPh.values()]) : tx('photos', 'readonly', s => s.getAll()),
  };
})();

/* ---------------------------------------------------------------- state */
const S = {settings: {inspector: ''}, journals: {}, results: {}, idx: {}, persisted: null, installEvt: null, storageError: false,
           ui: {tab: {}, q: {}, gq: '', scroll: {}, route: '', lastJid: null}};

function buildIdx(jid) {
  const j = S.journals[jid];
  S.idx[jid] = {byMark: new Map(j.cables.map(c => [c.mark, c])), pos: new Map(j.cables.map((c, i) => [c.mark, i]))};
}
function newCableResult(c) { return {entries: (c.route || []).map(seg => ({k: uid(), seg, st: ST.U, t: null})), finished: false, factLength: null, note: '', photos: [], updated: null}; }
function newResult(j) {
  const r = {journalId: j.id, hash: j.hash, created: nowIso(), updated: null, lastSent: null, unsent: 0, cables: {}};
  for (const c of j.cables) r.cables[c.mark] = newCableResult(c);
  return r;
}
function mergeResult(old, j) {
  const res = newResult(j); const changed = [];
  Object.assign(res, {created: old.created, lastSent: old.lastSent, unsent: old.unsent || 0, updated: old.updated});
  for (const c of j.cables) {
    const oc = old.cables[c.mark]; if (!oc) continue;
    const nc = res.cables[c.mark];
    Object.assign(nc, {finished: oc.finished, factLength: oc.factLength, note: oc.note, photos: oc.photos || [], updated: oc.updated});
    const oldDesign = oc.entries.filter(e => e.seg !== null).map(e => e.seg);
    if (JSON.stringify(oldDesign) === JSON.stringify(c.route || [])) { nc.entries = oc.entries; continue; }
    const pool = new Map(), addsAfter = new Map(); let anchor = '';
    for (const e of oc.entries) {
      if (e.seg === null) { if (!addsAfter.has(anchor)) addsAfter.set(anchor, []); addsAfter.get(anchor).push(e); }
      else { if (!pool.has(e.seg)) pool.set(e.seg, []); pool.get(e.seg).push(e); anchor = e.seg; }
    }
    const out = []; (addsAfter.get('') || []).forEach(e => out.push(e)); addsAfter.delete('');
    for (const seg of (c.route || [])) {
      const lst = pool.get(seg); const prev = lst && lst.length ? lst.shift() : null;
      out.push(prev || {k: uid(), seg, st: ST.U, t: null});
      if (addsAfter.has(seg)) { addsAfter.get(seg).forEach(e => out.push(e)); addsAfter.delete(seg); }
    }
    for (const lst of addsAfter.values()) lst.forEach(e => out.push(e));
    nc.entries = out; changed.push(c.mark);
  }
  const orphans = Object.assign({}, old.orphans || {});
  for (const m in old.cables) if (!j.cables.some(c => c.mark === m)) orphans[m] = old.cables[m];
  if (Object.keys(orphans).length) res.orphans = orphans;
  return {res, changed};
}

let saveChain = Promise.resolve();
function saveResult(jid) {
  const snap = S.results[jid];
  saveChain = saveChain.then(() => Store.set('result:' + jid, snap)).catch(err => { console.error(err); S.storageError = true; toast('Could not save to phone storage! Send results now.'); });
  return saveChain;
}
async function saveSettings() { try { await Store.set('settings', S.settings); } catch (e) { console.error(e); } }

let undo = null;
function snapshotCable(jid, mark) { return {jid, mark, data: JSON.parse(JSON.stringify(S.results[jid].cables[mark]))}; }
function commit(jid, mark, msg, snap) {
  const r = S.results[jid]; r.unsent = (r.unsent || 0) + 1; r.updated = nowIso();
  if (mark) r.cables[mark].updated = nowIso();
  saveResult(jid);
  if (snap) { undo = snap; toast(msg || 'Saved', 'Undo', doUndo); } else if (msg) toast(msg);
}
function doUndo() {
  if (!undo) return; const {jid, mark, data} = undo; undo = null;
  if (!S.results[jid]) return;
  S.results[jid].cables[mark] = data; S.results[jid].unsent = (S.results[jid].unsent || 0) + 1; saveResult(jid); render(); toast('Undone');
}

/* ---------------------------------------------------------------- stats & indexes */
function cableStats(rc) {
  const s = {total: 0, checked: 0, ok: 0, chg: 0, no: 0, add: 0};
  for (const e of rc.entries) {
    if (e.seg === null) { s.add++; continue; }
    s.total++; if (e.st !== ST.U) s.checked++;

/* ---------------------------------------------------------------- journals in/out */
function validateJournal(o) {

  if (o.format === 'ikj-field-results') return 'This is a RESULTS file (from “Send”), not a journal. Journals come from your supervisor.';
  if (o.format === 'ikj-field-backup') return 'This is a BACKUP file. Use Settings → Restore from backup.';
  if (o.format !== 'ikj-journal' || !o.id || !Array.isArray(o.cables)) return 'This is not an IKJ journal file.';
  for (const c of o.cables) if (!c || !c.mark || !Array.isArray(c.route)) return 'The journal file is damaged (cable without mark or route).';
  return null;
}
async function addJournal(j, opts = {}) {
  const err = validateJournal(j); if (err) throw new Error(err);
  const exist = S.journals[j.id];
  if (exist && exist.hash === j.hash) {
    if (JSON.stringify(exist) === JSON.stringify(j)) { if (!opts.silent) toast('This journal is already on the phone.'); return j.id; }
    /* same cables and routes, only descriptions changed: replace, marks stay as they are */
    S.journals[j.id] = j; await Store.set('journal:' + j.id, j); buildIdx(j.id);
    if (!opts.silent) toast(`Journal info updated: ${shortId(j.id)}. Your marks are kept.`);
    return j.id;
  }
  if (exist) {
    const ok = await confirmSheet(`<b>${esc(j.id)}</b> is already on this phone, but this file is a different version (the design was updated).<br><br>Update it? Your marks are kept where the trays are the same.`, 'Update journal', 'Cancel');
    if (!ok) return null;
  }
  S.journals[j.id] = j; await Store.set('journal:' + j.id, j); buildIdx(j.id);
  if (S.results[j.id]) {
    const {res, changed} = mergeResult(S.results[j.id], j); S.results[j.id] = res;
    if (changed.length) toast(`Journal updated. Routes changed for ${plural(changed.length, 'cable')}.`);
  } else S.results[j.id] = newResult(j);
  await saveResult(j.id);
  if (!opts.silent && !exist) toast(`Loaded: ${shortId(j.id)} (${plural(j.cables.length, 'cable')})`);

}
function readFileText(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsText(file); }); }

async function buildExport(jid, withPhotos) {
  const j = S.journals[jid], r = S.results[jid], cables = [];
  for (const c of j.cables) {
    const rc = r.cables[c.mark];
    const entries = rc.entries.map(e => { const o = {seg: e.seg, status: e.seg === null ? ST.ADD : e.st}; if (e.fact) o.fact = e.fact; if (e.t) o.t = e.t; return o; });
    const photos = [];

    }

    inspector: S.settings.inspector || '', exportedAt: nowIso(), summary: journalStats(jid), photosIncluded: !!withPhotos, cables};

  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function shareOrSave(file, mode) {
  if (mode === 'share' && navigator.canShare && navigator.share) {
    let can = false; try { can = navigator.canShare({files: [file]}); } catch (e) {}
    if (can) {

      catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; console.warn(e); }
    }

/* ---------------------------------------------------------------- mutations */
function getEntry(jid, mark, k) { const rc = S.results[jid].cables[mark]; const i = rc.entries.findIndex(e => e.k === k); return {rc, i, e: rc.entries[i]}; }
function setDesign(jid, mark, k, st, fact) {
  const snap = snapshotCable(jid, mark); const {e} = getEntry(jid, mark, k); if (!e || e.seg === null) return;
  if (st === ST.CHG && fact === e.seg) st = ST.OK;
  e.st = st; if (st === ST.CHG) e.fact = fact; else delete e.fact; e.t = nowIso();
  const msg = {[ST.OK]: '✓ ' + e.seg, [ST.NO]: '✗ Not here: ' + e.seg, [ST.CHG]: e.seg + ' → ' + fact, [ST.U]: 'Mark cleared'}[st];
  commit(jid, mark, msg, snap);
}
function setAdded(jid, mark, k, fact) { const snap = snapshotCable(jid, mark); const {e} = getEntry(jid, mark, k); if (!e) return; e.fact = fact; e.t = nowIso(); commit(jid, mark, '+ ' + fact, snap); }
function deleteAdded(jid, mark, k) { const snap = snapshotCable(jid, mark); const rc = S.results[jid].cables[mark]; rc.entries = rc.entries.filter(x => x.k !== k); commit(jid, mark, 'Added tray deleted', snap); }
function insertAt(jid, mark, afterK, code) {
  const snap = snapshotCable(jid, mark); const rc = S.results[jid].cables[mark];
  const ne = {k: uid(), seg: null, st: ST.ADD, fact: code, t: nowIso()};

  else if (afterK === 'END') rc.entries.push(ne);
  else { const i = rc.entries.findIndex(e => e.k === afterK); rc.entries.splice(i < 0 ? rc.entries.length : i + 1, 0, ne); }

}

  const rc = S.results[jid].cables[mark], src = actualRoute(S.results[sj].cables[sm]);
  const srcSet = new Set(src), have = new Set(actualRoute(rc)), confirm = [], add = [];
  for (const e of rc.entries) if (e.seg !== null && e.st === ST.U && srcSet.has(e.seg)) { confirm.push(e.seg); have.add(e.seg); }

  for (const code of p.add) rc.entries.push({k: uid(), seg: null, st: ST.ADD, fact: code, t: now});

/* bottom sheet with Android back-button support.
   Opening a sheet pushes a history entry, so the phone's Back closes the sheet.
   Closing it from code goes back over that entry; until that back step has finished, further history
   changes (a new sheet, navigation) wait for it — otherwise they could be undone by it. */
let sheetHandler = null, sheetInput = null, sheetPushed = false, backPending = false, backTimer = null;
const afterBack = [];
const sheetOpen = () => !sheet.classList.contains('hidden');
function whenHistoryIdle(fn) { if (backPending) afterBack.push(fn); else fn(); }
function backDone() {
  clearTimeout(backTimer); backPending = false;
  for (const f of afterBack.splice(0)) { try { f(); } catch (e) { console.error(e); } }
}
function pushSheetEntry() { if (sheetOpen() && !sheetPushed) { try { history.pushState({ikjSheet: 1}, ''); sheetPushed = true; } catch (e) {} } }
function openSheet(html, onAct, onInput) {
  sheet.innerHTML = `<div class="sheet-bd" data-sact="close"></div><div class="sheet-pn">${html}</div>`;
  sheet.classList.remove('hidden'); sheetHandler = onAct || null; sheetInput = onInput || null;
  whenHistoryIdle(pushSheetEntry);
}
function hideSheet() {

}
function closeSheet(fromPop) {

}

  sheetPushed = false;

});
/* navigate (waits for a pending back step) */
function nav(hash) { whenHistoryIdle(() => { if (location.hash === hash) render(); else location.hash = hash; }); }
/* navigate from inside a sheet: the sheet's history entry is replaced (no dead Back press);
   opts.replace: replace the current page in history (prev/next cable) */
function go(hash, opts = {}) {

  const wasOpen = hideSheet();
  whenHistoryIdle(() => {
    if ((wasOpen && sheetPushed) || opts.replace) {

}

/* code picker: resolves to a code or null */
function pickCode({title, base, sub}) {

    const known = knownCodes();

/* ---------------------------------------------------------------- router */
function parseRoute() {
  const p = location.hash.replace(/^#/, '').split('/').filter(Boolean).map(dec);
  if (p[0] === 'j' && p[1]) {
    if (p[2] === 'c' && p.length >= 4) return {v: 'cable', jid: p[1], mark: p.slice(3).join('/')};
    if (p[2] === 't' && p.length >= 4) return {v: 'tray', jid: p[1], code: p.slice(3).join('/')};
    return {v: 'journal', jid: p[1]};
  }
  if (p[0] === 't' && p.length >= 2) return {v: 'tray', jid: null, code: p.slice(1).join('/')};
  if (p[0] === 'settings') return {v: 'settings'};
  if (p[0] === 'help') return {v: 'help'};
  return {v: 'home'};
}
const rJ = jid => '#/j/' + enc(jid);
const rC = (jid, mark) => `#/j/${enc(jid)}/c/${enc(mark)}`;

function render() {
  const key = location.hash || '#/';
  if (S.ui.route && S.ui.route !== key) S.ui.scroll[S.ui.route] = window.scrollY;
  const isNew = S.ui.route !== key; S.ui.route = key;
  if (sheetOpen() && isNew) closeSheet(true);
  const r = parseRoute();
  try {
    if (r.v === 'journal' && S.journals[r.jid]) { S.ui.lastJid = r.jid; viewJournal(r.jid); }
    else if (r.v === 'cable' && S.journals[r.jid] && S.idx[r.jid].byMark.has(r.mark)) { S.ui.lastJid = r.jid; viewCable(r.jid, r.mark); }
    else if (r.v === 'tray') { if (r.jid && S.journals[r.jid]) S.ui.lastJid = r.jid; viewTray(r.code); }
    else if (r.v === 'settings') viewSettings();
    else if (r.v === 'help') viewHelp();
    else { S.ui.lastJid = null; viewHome(); }
  } catch (e) { console.error(e); view.innerHTML = `<div class="errbox">Something went wrong: ${esc(e.message)}</div><button class="btn" onclick="location.hash='#/'">Home</button>`; }
  if (isNew) window.scrollTo(0, S.ui.scroll[key] || 0);
}

function renderGlobal(q) {
  const box = $('#glist'); if (!box) return;
  const qs = squash(q); if (!qs) { box.innerHTML = ''; return; }
  const ids = journalIds(), multi = ids.length > 1;
  let h = '', n = 0;
  for (const id of ids) for (const c of S.journals[id].cables) {
    if (!(squash(c.no).includes(qs) || squash(c.mark).includes(qs))) continue;
    if (n++ >= 40) continue;
    const rc = S.results[id].cables[c.mark];
    h += `<button class="card" data-act="openGC" data-j="${esc(id)}" data-m="${esc(c.mark)}">
      <div class="item-top"><span><span class="cno">${esc(c.no)}</span><span class="mark">${esc(c.mark)}</span></span>
      <span>${multi ? `<span class="jchip">${esc(shortId(id))}</span> ` : ''}${c.section ? `<span class="jchip">${esc(c.section)}</span> ` : ''}${rc && rc.finished ? '<span class="chip ok">Done</span>' : ''}</span></div>
      <div class="tiny muted ft">${esc(c.from)} → ${esc(c.to)}</div></button>`;
  }
  const all = trayMapAll(), codes = matchCodes([...all.keys()].sort(natCmp), q).slice(0, 20);
  for (const code of codes) {
    const t = all.get(code), js = [...new Set(t.design.map(d => d.jid))];
    h += `<button class="card" data-act="openGT" data-code="${esc(code)}"><div class="item-top"><span class="code">${esc(code)}</span>
      <span class="small muted">tray · ${plural(t.design.length, 'cable')}${multi && js.length ? ' · ' + js.map(shortId).join(', ') : ''}</span></div></button>`;
  }
  if (!h) h = `<div class="card small muted">Nothing found for “${esc(q)}”.</div>`;
  else if (n > 40) h += `<div class="small muted" style="margin:0 2px 10px">${n - 40} more cables — type more digits.</div>`;
  box.innerHTML = h + '<div style="height:6px"></div>';
}
function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }

function renderJList(jid, tab, q) {
  const j = S.journals[jid], qs = squash(q);
  let h = '';
  if (tab === 'cable') {
    const list = j.cables.filter(c => !qs || squash(c.no).includes(qs) || squash(c.mark).includes(qs) || squash(c.from + ' ' + c.to).includes(qs));
    const secs = (j.sections || []).length > 1 ? j.sections : null;
    let last = null;
    for (const c of list) {
      if (secs && c.section !== last) {
        last = c.section; const s = secs.find(x => x.id === c.section);
        h += `<div class="sec-h">${esc(c.section || '')}${s && s.title ? ' · ' + esc(s.title) : ''}${s && s.sheets ? ` <span class="muted">(sheets ${esc(s.sheets)})</span>` : ''}</div>`;
      }
      h += cableCard(jid, c);
    }
    if (!list.length) h = `<div class="card muted">No cable matches “${esc(q)}”.</div>`;
  } else {
    const all = trayMapAll();
    const mine = [...all.values()].filter(t => t.design.some(d => d.jid === jid) || t.field.some(d => d.jid === jid));
    const keep = new Set(matchCodes(mine.map(t => t.code), q));
    const trays = mine.filter(t => keep.has(t.code)).sort((a, b) => natCmp(a.code, b.code));
    for (const t of trays) {
      const dm = t.design.filter(d => d.jid === jid), fm = t.field.filter(d => d.jid === jid);
      const chk = dm.filter(d => d.st !== ST.U).length, moved = dm.filter(d => d.st === ST.CHG || d.st === ST.NO).length;
      const others = t.design.filter(d => d.jid !== jid), oj = [...new Set(others.map(d => d.jid))];
      h += `<button class="card" data-act="openT" data-code="${esc(t.code)}">
        <div class="item-top"><span class="code">${esc(t.code)}</span>${dm.length && chk === dm.length ? '<span class="chip ok">Checked</span>' : ''}</div>
        <div class="small muted">${dm.length ? `${plural(dm.length, 'cable')} by design · ${chk} checked` : 'Not in design'}${moved ? ` · <span class="red">${moved} not here/moved</span>` : ''}${fm.length ? ` · <span class="blue">${fm.length} found here</span>` : ''}${others.length ? ` · <span class="jchip">+${others.length} in ${esc(oj.map(shortId).join(', '))}</span>` : ''}</div>
      </button>`;
    }
    if (!trays.length) h = `<div class="card muted">No tray matches “${esc(q)}”.</div>`;
  }
  $('#jlist').innerHTML = h;
}

function routeRow(e, n) {
  if (e.seg === null) return `<li class="rr add"><span class="num blue">+</span>
      <button class="code-btn" data-act="entry" data-k="${e.k}"><span class="code blue">${esc(e.fact)}</span><span class="small blue">added in the field · tap to edit</span></button></li>`;
  let cls = '', code = `<span class="code">${esc(e.seg)}</span>`, st = '<span class="small muted">not checked</span>';
  if (e.st === ST.OK) { cls = 'ok'; st = '<span class="small okc"><b>✓ cable is here</b></span>'; }
  else if (e.st === ST.CHG) { cls = 'chg'; code = `<span class="code red"><s>${esc(e.seg)}</s></span><span class="code blue">→ ${esc(e.fact)}</span>`; st = '<span class="small blue">actual tray differs</span>'; }
  else if (e.st === ST.NO) { cls = 'no'; code = `<span class="code red"><s>${esc(e.seg)}</s></span>`; st = '<span class="small red"><b>✗ cable is not here</b></span>'; }
  return `<li class="rr ${cls}"><span class="num">${n}</span>
    <button class="code-btn" data-act="entry" data-k="${e.k}">${code}${st}</button>
    <button class="tick ${e.st === ST.OK ? 'on' : ''}" data-act="tick" data-k="${e.k}" aria-label="Cable is here">✓</button></li>`;

const photoURLs = [];
async function renderPhotos(jid, mark) {

  if ($('#photos') === box) box.innerHTML = h || '<span class="small muted">No photos</span>';

  function upd() {
    const qs = squash($('#swq').value), secs = (j.sections || []).length > 1;

function openCopy(jid, mark) {

    const ids = [jid, ...journalIds().filter(x => x !== jid)];

    if (act !== 'share' && act !== 'save') return;
    const inc = $('#incPh') ? $('#incPh').checked : false;
    busy(true); let text;

async function doBackup() {
  busy(true);
  try {
    const photos = [];
    for (const p of await Store.allPhotos()) photos.push({id: p.id, jid: p.jid, mark: p.mark, name: p.name, takenAt: p.takenAt, data: await blobToDataURL(p.blob)});
    const out = {format: 'ikj-field-backup', version: 1, app: 'IKJ Field ' + APP_VERSION, exportedAt: nowIso(), settings: S.settings,
      journals: Object.values(S.journals), results: Object.values(S.results), photos};
    const file = new File([JSON.stringify(out)], `IKJ_backup_${stamp()}.txt`, {type: 'text/plain'});
    busy(false); const res = await shareOrSave(file, 'share');
    toast(res === 'cancelled' ? 'Backup not sent' : (res === 'shared' ? 'Backup sent ✓' : 'Backup saved to Downloads'));
  } catch (e) { busy(false); toast('Backup failed: ' + e.message); }
}
async function doRestore(file) {
  let o; try { o = JSON.parse(await readFileText(file)); } catch (e) { toast('Cannot read this file.'); return; }
  if (!o || o.format !== 'ikj-field-backup') { toast('This is not an IKJ backup file.'); return; }
  const ok = await confirmSheet(`Restore <b>${plural((o.journals || []).length, 'journal')}</b> from the backup of ${fmtTime(o.exportedAt)}?<br><br>Data of the same journals on this phone will be <b>replaced</b>.`, 'Restore', 'Cancel', true);
  if (!ok) return;
  busy(true);
  try {
    for (const j of o.journals || []) { if (validateJournal(j)) continue; S.journals[j.id] = j; await Store.set('journal:' + j.id, j); buildIdx(j.id); }
    for (const r of o.results || []) { if (!r.journalId || !S.journals[r.journalId]) continue; S.results[r.journalId] = r; await Store.set('result:' + r.journalId, r); }
    for (const p of o.photos || []) { await Store.putPhoto({id: p.id, jid: p.jid, mark: p.mark, name: p.name, takenAt: p.takenAt, blob: await dataURLToBlob(p.data)}); }
    if (o.settings && o.settings.inspector && !S.settings.inspector) { S.settings.inspector = o.settings.inspector; await saveSettings(); }
    busy(false); toast('Restored ✓'); nav('#/');
  } catch (e) { busy(false); toast('Restore failed: ' + e.message); }
}

/* ---------------------------------------------------------------- photos */
let photoTarget = null;
async function downscale(file, max = 1600, q = 0.72) {
  let src;
  try { src = await createImageBitmap(file); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, sc = Math.min(1, max / Math.max(w0, h0));
  const cv = document.createElement('canvas'); cv.width = Math.round(w0 * sc); cv.height = Math.round(h0 * sc);
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', q));
}
$('#filePhoto').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f || !photoTarget) return;
  const {jid, mark} = photoTarget; busy(true);
  try {
    const blob = await downscale(f); const rc = S.results[jid].cables[mark];
    const n = (rc.photos || []).length + 1, safe = mark.replace(/[^A-Za-z0-9-]/g, '_');
    const p = {id: uid(), jid, mark, name: `${safe}_${stamp()}_${n}.jpg`, takenAt: nowIso(), blob};
    await Store.putPhoto(p); rc.photos = [...(rc.photos || []), p.id];
    busy(false); commit(jid, mark, 'Photo added'); render();
  } catch (e) { busy(false); toast('Photo failed: ' + e.message); }
});
async function openPhoto(jid, mark, pid) {
  const p = await Store.getPhoto(pid); if (!p) return; const u = URL.createObjectURL(p.blob);
  const handler = async act => {
    if (act === 'delp') {
      const rc = S.results[jid].cables[mark]; rc.photos = rc.photos.filter(x => x !== pid); await Store.delPhoto(pid);
      commit(jid, mark, 'Photo deleted'); closeSheet(); render();
    }
  };
  handler.onClose = () => URL.revokeObjectURL(u);
  openSheet(`<img src="${u}" alt="photo" style="width:100%;border-radius:12px;margin-bottom:10px"><div class="tiny muted" style="margin:0 2px 10px">${esc(p.name)} · ${fmtTime(p.takenAt)}</div>
    <button class="btn danger-outline" data-sact="delp">Delete photo</button><button class="btn ghost" data-sact="close">Close</button>`, handler);
}

async function toggleFinish(jid, mark) {
  const rc = S.results[jid].cables[mark], snap = snapshotCable(jid, mark);
  if (rc.finished) { rc.finished = false; commit(jid, mark, 'Cable reopened', snap); render(); return; }
  const s = cableStats(rc), left = s.total - s.checked;
  if (left > 0) { const ok = await confirmSheet(`<b>${plural(left, 'tray')}</b> of this cable not checked yet.<br>Mark the cable as done anyway?`, 'Mark done anyway', 'Go back'); if (!ok) return; }
  rc.finished = true; commit(jid, mark, 'Cable marked as done', snap); render();
}

    case 'tNo': { const {e} = getEntry(jid, el.dataset.m, el.dataset.k); setDesign(jid, el.dataset.m, el.dataset.k, e.st === ST.NO ? ST.U : ST.NO); render(); break; }
    case 'tOther': openEntrySheet(jid, el.dataset.m, el.dataset.k); break;
    case 'tAdd': trayAddCable(el.dataset.code); break;
    case 'backup': doBackup(); break;
    case 'restore': $('#fileBackup').click(); break;
  }
});
$('#fileJournal').addEventListener('change', async ev => {
  const files = [...(ev.target.files || [])]; ev.target.value = ''; if (!files.length) return;
  const one = files.length === 1, ids = [], errs = [];
  for (const f of files) {
    let o;
    try { o = JSON.parse(await readFileText(f)); }
    catch (e) { errs.push((one ? '' : f.name + ': ') + 'Cannot read this file — is it the .ikj.json journal?'); continue; }
    try { const id = await addJournal(o, {silent: !one}); if (id) ids.push(id); }
    catch (e) { errs.push((one ? '' : f.name + ': ') + e.message); }
  }
  if (errs.length) toast(one ? errs[0] : `Loaded ${ids.length} of ${files.length}. ${errs[0]}`);
  else if (!one) toast(`Loaded ✓ ${ids.map(shortId).join(', ')}`);
  if (one && ids.length) nav(rJ(ids[0])); else if (ids.length) nav('#/'); else render();
});
$('#fileBackup').addEventListener('change', async ev => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) doRestore(f); });

/* ---------------------------------------------------------------- install / service worker */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (parseRoute().v === 'home') render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('App installed ✓'); });
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (window.__ikjUpdating && !reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const show = w => { $('#upd').classList.remove('hidden'); $('#updBtn').onclick = () => { window.__ikjUpdating = true; w.postMessage('skipWaiting'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); }); });
  }).catch(e => console.warn('SW', e));
}

/* ---------------------------------------------------------------- boot */
(async function boot() {
  await Store.open();
  try {
    for (const k of await Store.keys()) {
      const v = await Store.get(k);
      if (k === 'settings' && v) S.settings = Object.assign(S.settings, v);
      else if (k.startsWith('journal:') && v && v.id) S.journals[v.id] = v;
      else if (k.startsWith('result:') && v && v.journalId) S.results[v.journalId] = v;
    }
  } catch (e) { console.error(e); }
  for (const id in S.journals) {
    buildIdx(id);
    if (!S.results[id]) S.results[id] = newResult(S.journals[id]);
    for (const c of S.journals[id].cables) if (!S.results[id].cables[c.mark]) S.results[id].cables[c.mark] = newCableResult(c);
  }
  for (const ej of [].concat(EMBEDDED_JOURNAL || [])) if (!S.journals[ej.id]) { try { await addJournal(ej, {silent: true}); } catch (e) { console.error(e); } }
  try { if (navigator.storage && navigator.storage.persist) { S.persisted = await navigator.storage.persisted(); if (!S.persisted) S.persisted = await navigator.storage.persist(); } } catch (e) {}
  registerSW();
  render();
})();
</script>
